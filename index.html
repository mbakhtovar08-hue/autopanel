<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoPanel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<aside class="sidebar" id="sidebar">

  <div class="brand">
    <span></span>
    AutoPanel
  </div>

  <nav>
    <button data-page="dashboard">▦ Dashboard</button>
    <button data-page="orders">▤ Заказы</button>
    <button data-page="customers">♙ Клиенты</button>
    <button data-page="services">◈ Услуги</button>
    <button data-page="automation">⚙ Автоматизация</button>
    <button data-page="balance">₽ Баланс</button>
    <button data-page="activity">◷ Активность</button>
    <button data-page="settings">☷ Настройки</button>
  </nav>

</aside>

<main>

<header>

  <button id="menu">☰</button>

  <div>
    <small>ADMIN PANEL</small>
    <h1 id="title">Dashboard</h1>
  </div>

  <div class="right">
    <span>Баланс: 12 450 ₽</span>
    <b>A</b>
  </div>

</header>

<section id="content"></section>

</main>

<div class="modal hidden" id="modal">

  <div class="modalbox">

    <button id="x">×</button>

    <h2>Детали заказа</h2>

    <div class="details">

      <div>
        ID
        <b>#1001</b>
      </div>

      <div>
        Клиент
        <b>demo_user</b>
      </div>

      <div>
        Услуга
        <b>Подписчики</b>
      </div>

      <div>
        Количество
        <b>1 000</b>
      </div>

      <div>
        Цена
        <b>490 ₽</b>
      </div>

      <div>
        Статус
        <b>В обработке</b>
      </div>

    </div>

    <button class="primary" id="close">
      Закрыть
    </button>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
